services:
  front:
    container_name: wishlist-front
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8080:80'
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    container_name: wishlist-backend
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    ports:
      - '3000:3000'
    command: sh -c "npm ci && ([ -f db.json ] || npm run db:generate) && npx json-server db.json --watch --host 0.0.0.0 --port 3000"
    restart: unless-stopped

volumes:
  backend_node_modules:
